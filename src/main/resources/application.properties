server.port=8080
spring.application.name=registro-usuarios-api

# --- Base de datos en memoria (H2) ---
spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Consola web de H2: http://localhost:8080/h2-console ---
# JDBC URL: jdbc:h2:mem:usuariosdb  |  User: sa  |  Password: (vacio)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Para usar MySQL: comentar H2 de arriba, agregar el driver mysql-connector-j al pom y descomentar ---
# spring.datasource.url=jdbc:mysql://localhost:3306/usuariosdb?createDatabaseIfNotExist=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=TU_PASSWORD

# --- Todo en JSON, tambien los errores ---
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false

# --- Validaciones configurables (expresiones regulares) ---
app.validation.email-regex=^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$
# Contrasena: minimo 6 caracteres (maximo 64), al menos una mayuscula y al menos un numero.
# Ejemplos validos: Hunter2, Secreto1. Invalidos: hunter2 (sin mayuscula), Secreto (sin numero), Ab1 (corta).
app.validation.password-regex=^(?=.*[A-Z])(?=.*\\d).{6,64}$
# Mensaje si la contrasena no cumple la regex (actualizarlo si se cambia la regex).

app.validation.password-message=La password  debe tener al menos 6 caracteres, una mayuscula y un numero

# --- JWT ---
# Secreto de al menos 32 caracteres. En produccion: variable de entorno JWT_SECRET
app.jwt.secret=${JWT_SECRET:cambiar-este-secreto-por-uno-propio-de-32-o-mas-caracteres}
app.jwt.expiration-minutes=60
